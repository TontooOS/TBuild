[package]
name = "tbuild"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "TontooOS app builder"
authors = ["arlomu"]

[[bin]]
name = "tbuild"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
# TontooOS SDK: ArchiveKit (TAPP containers), CoreIcon (.tico icons),
# Foundation (JSON). On-device: /Library/System/sdk.
sdk = { path = "/Library/System/sdk", features = ["ArchiveKit", "CoreIcon", "Foundation"] }
