[package]
name = "tinstaller"
version = "0.1.0"
edition = "2021"
license = "TCL"
description = "TontooOS .tinstaller runtime — installs .app bundles"

[[bin]]
name = "tinstaller"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: TontooUI (Vello installer UI), ArchiveKit (TAPP payload),
# Foundation (footer/lang JSON). On-device: /Library/System/sdk.
sdk = { path = "/Library/System/sdk", features = ["TontooUI", "ArchiveKit", "Foundation"] }
vello = "0.10"
