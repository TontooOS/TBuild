[package]
name = "tinstaller"
version = "0.1.0"
edition = "2021"
license = "TCL"
description = "TontooOS .tinstaller runtime — installs .app bundles"

[[bin]]
name = "tinstaller"
path = "src/main.rs"

[dependencies]
uikit = { path = "/Library/System/uikit" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }